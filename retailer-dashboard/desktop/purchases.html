<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Purchases - Retailer Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="glass.css">
  <script src="auth.js"></script>
</head>
<body data-page="purchases" data-title="Purchases">

<div class="app">
  <main class="main">
    <section class="kpis">
      <div class="kpi"><span class="glyph">📋</span><span class="label">Total POs</span><span class="value" id="kpiTotal">0</span><span class="delta">All purchase orders</span></div>
      <div class="kpi warn"><span class="glyph">⏱</span><span class="label">Pending</span><span class="value" id="kpiPending">0</span><span class="delta">Awaiting approval</span></div>
      <div class="kpi success"><span class="glyph">✓</span><span class="label">Received</span><span class="value" id="kpiReceived">0</span><span class="delta up">Completed</span></div>
      <div class="kpi purple"><span class="glyph">₹</span><span class="label">Total Spend</span><span class="value" id="kpiSpend">₹0</span><span class="delta">All POs</span></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h3>Purchase Orders</h3>
        <div class="filters">
          <button class="btn btn-primary" onclick="openModal('newPOModal')">+ New Purchase Order</button>
        </div>
      </div>
      <div class="card-body">
        <div class="filters filters-bar">
          <div class="search-wrap"><input type="text" placeholder="Search..." id="searchInput" class="search" onkeyup="filterTable()"></div>
          <select id="statusFilter" onchange="filterTable()">
            <option value="">All Status</option>
            <option>Draft</option>
            <option>Pending</option>
            <option>Approved</option>
            <option>Received</option>
            <option>Cancelled</option>
          </select>
          <button class="btn btn-ghost" onclick="clearFilters()">Clear Filters</button>
        </div>

        <div class="table-wrap">
          <table id="purchasesTable">
            <thead>
              <tr>
                <th>PO #</th>
                <th>Supplier</th>
                <th>Status</th>
                <th>Created</th>
                <th>Expected</th>
                <th>Total</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="purchasesBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="modal" id="newPOModal">
  <div class="modal-content">
    <button class="close-modal" onclick="closeModal()">×</button>
    <h2>New Purchase Order</h2>
    <form onsubmit="createPO(event)">
      <div class="form-grid">
        <div class="form-group full"><label>Supplier Name</label><input type="text" name="supplier" required></div>
        <div class="form-group"><label>Total Amount (₹)</label><input type="number" name="total" step="0.01" min="0" required></div>
        <div class="form-group"><label>Expected Date</label><input type="date" name="expectedDate" required></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Create PO</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="shell.js"></script>
<script src="common.js"></script>
<script>
  let purchases = JSON.parse(localStorage.getItem('retailer_purchases') || '[]');

  function pillClass(status) {
    const s = status.toLowerCase();
    if (s === 'received' || s === 'approved') return 'ready';
    if (s === 'pending') return 'pending';
    if (s === 'cancelled') return 'out';
    return 'processing';
  }

  function renderKPIs(){
    document.getElementById('kpiTotal').textContent = purchases.length;
    document.getElementById('kpiPending').textContent = purchases.filter(p=>['Draft','Pending'].includes(p.status)).length;
    document.getElementById('kpiReceived').textContent = purchases.filter(p=>p.status==='Received').length;
    document.getElementById('kpiSpend').textContent = '₹' + purchases.reduce((s,p)=>s+p.total,0).toLocaleString('en-IN');
  }

  function renderTable(){
    renderKPIs();
    const tbody = document.getElementById('purchasesBody');
    tbody.innerHTML = purchases.map(po => `
      <tr>
        <td><span class="sku">${po.poNumber}</span></td>
        <td>${po.supplier}</td>
        <td><span class="pill ${pillClass(po.status)}"><span class="dot"></span>${po.status}</span></td>
        <td>${po.created}</td>
        <td>${po.expected}</td>
        <td><b>₹${po.total.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</b></td>
        <td>
          <div class="row-actions">
            <button class="btn-sm primary" onclick="viewPO(${po.id})">View</button>
            <button class="btn-sm danger" onclick="deletePO(${po.id})">Delete</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  function filterTable(){
    const term = document.getElementById('searchInput').value.toLowerCase();
    const status = document.getElementById('statusFilter').value;
    const rows = document.querySelectorAll('#purchasesBody tr');
    rows.forEach(row => {
      const text = row.textContent.toLowerCase();
      const rowStatus = row.cells[2]?.textContent.trim();
      const match = text.includes(term) && (status === '' || rowStatus === status);
      row.style.display = match ? '' : 'none';
    });
  }

  function clearFilters(){
    document.getElementById('searchInput').value = '';
    document.getElementById('statusFilter').value = '';
    filterTable();
  }

  function createPO(e){
    e.preventDefault();
    const form = e.target;
    const newPO = {
      id: Date.now(),
      poNumber: 'PO-' + (1000 + purchases.length + 1),
      supplier: form.supplier.value,
      status: 'Draft',
      created: new Date().toISOString().split('T')[0],
      expected: form.expectedDate.value,
      total: parseFloat(form.total.value)
    };
    purchases.push(newPO);
    localStorage.setItem('retailer_purchases', JSON.stringify(purchases));
    renderTable();
    showToast('Purchase order created!');
    closeModal();
    form.reset();
  }

  function viewPO(id){
    const po = purchases.find(p => p.id === id);
    if(po) showToast(`Viewing ${po.poNumber}`);
  }

  function deletePO(id){
    if(confirm('Delete this purchase order?')){
      purchases = purchases.filter(p => p.id !== id);
      localStorage.setItem('retailer_purchases', JSON.stringify(purchases));
      renderTable();
      showToast('Purchase order deleted!');
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderTable();
  });
</script>
</body>
</html>
