<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Suppliers - Retailer Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="glass.css">
  <script src="auth.js"></script>
</head>
<body data-page="suppliers" data-title="Suppliers">

<div class="app">
  <main class="main">
    <section class="kpis">
      <div class="kpi"><span class="glyph">🏭</span><span class="label">Total Suppliers</span><span class="value" id="kpiTotal">0</span><span class="delta">Registered vendors</span></div>
      <div class="kpi success"><span class="glyph">✓</span><span class="label">Active</span><span class="value" id="kpiActive">0</span><span class="delta up">Currently trading</span></div>
      <div class="kpi warn"><span class="glyph">⏸</span><span class="label">Inactive</span><span class="value" id="kpiInactive">0</span><span class="delta">Paused accounts</span></div>
      <div class="kpi purple"><span class="glyph">📧</span><span class="label">With Email</span><span class="value" id="kpiEmail">0</span><span class="delta">Contactable</span></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h3>Suppliers</h3>
        <div class="filters">
          <button class="btn btn-primary" onclick="openModal('supplierModal')">+ Add Supplier</button>
        </div>
      </div>
      <div class="card-body">
        <div class="filters filters-bar">
          <div class="search-wrap"><input type="text" placeholder="Search suppliers..." id="searchInput" class="search" onkeyup="filterTable()"></div>
          <select id="statusFilter" onchange="filterTable()">
            <option value="">All Status</option>
            <option>Active</option>
            <option>Inactive</option>
          </select>
          <button class="btn btn-ghost" onclick="clearFilters()">Clear Filters</button>
        </div>

        <div class="table-wrap">
          <table id="suppliersTable">
            <thead>
              <tr>
                <th>Company Name</th>
                <th>Contact Person</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="suppliersBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="modal" id="supplierModal">
  <div class="modal-content">
    <button class="close-modal" onclick="closeModal()">×</button>
    <h2 id="modalTitle">Add Supplier</h2>
    <form onsubmit="saveSupplier(event)">
      <input type="hidden" id="editId">
      <div class="form-grid">
        <div class="form-group full"><label>Company Name *</label><input type="text" id="companyName" required></div>
        <div class="form-group full"><label>Contact Person</label><input type="text" id="contactPerson"></div>
        <div class="form-group"><label>Email *</label><input type="email" id="email" required></div>
        <div class="form-group"><label>Phone *</label><input type="tel" id="phone" required></div>
        <div class="form-group full"><label>Address</label><textarea id="address" rows="3"></textarea></div>
        <div class="form-group"><label>Status</label>
          <select id="status">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Supplier</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="shell.js"></script>
<script src="common.js"></script>
<script>
  let suppliers = JSON.parse(localStorage.getItem('retailer_suppliers') || '[]');
  let editId = null;

  function pillClass(status) {
    return status === 'Active' ? 'ready' : 'out';
  }

  function renderKPIs(){
    document.getElementById('kpiTotal').textContent = suppliers.length;
    document.getElementById('kpiActive').textContent = suppliers.filter(s=>s.status==='Active').length;
    document.getElementById('kpiInactive').textContent = suppliers.filter(s=>s.status==='Inactive').length;
    document.getElementById('kpiEmail').textContent = suppliers.filter(s=>s.email).length;
  }

  function renderTable(){
    renderKPIs();
    const tbody = document.getElementById('suppliersBody');
    tbody.innerHTML = suppliers.map(s => `
      <tr>
        <td><span class="sku">${s.name}</span></td>
        <td>${s.contact || '-'}</td>
        <td>${s.email}</td>
        <td>${s.phone}</td>
        <td>${(s.address || '-').substring(0, 30)}${(s.address || '').length > 30 ? '...' : ''}</td>
        <td><span class="pill ${pillClass(s.status)}"><span class="dot"></span>${s.status}</span></td>
        <td>
          <div class="row-actions">
            <button class="btn-sm primary" onclick="editSupplier(${s.id})">Edit</button>
            <button class="btn-sm danger" onclick="deleteSupplier(${s.id})">Delete</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  function filterTable(){
    const term = document.getElementById('searchInput').value.toLowerCase();
    const status = document.getElementById('statusFilter').value;
    const rows = document.querySelectorAll('#suppliersBody tr');
    rows.forEach(row => {
      const text = row.textContent.toLowerCase();
      const rowStatus = row.cells[5]?.textContent.trim();
      const match = text.includes(term) && (status === '' || rowStatus === status);
      row.style.display = match ? '' : 'none';
    });
  }

  function clearFilters(){
    document.getElementById('searchInput').value = '';
    document.getElementById('statusFilter').value = '';
    filterTable();
  }

  function saveSupplier(e){
    e.preventDefault();
    const supplier = {
      id: editId || Date.now(),
      name: document.getElementById('companyName').value,
      contact: document.getElementById('contactPerson').value,
      email: document.getElementById('email').value,
      phone: document.getElementById('phone').value,
      address: document.getElementById('address').value,
      status: document.getElementById('status').value
    };
    if(editId){
      suppliers = suppliers.map(s => s.id === editId ? supplier : s);
      showToast('Supplier updated!');
    } else {
      suppliers.push(supplier);
      showToast('Supplier added!');
    }
    localStorage.setItem('retailer_suppliers', JSON.stringify(suppliers));
    renderTable();
    closeModal();
    document.getElementById('supplierModal').querySelector('form').reset();
    editId = null;
  }

  function editSupplier(id){
    const s = suppliers.find(x => x.id === id);
    if(s){
      editId = id;
      document.getElementById('modalTitle').textContent = 'Edit Supplier';
      document.getElementById('companyName').value = s.name;
      document.getElementById('contactPerson').value = s.contact || '';
      document.getElementById('email').value = s.email;
      document.getElementById('phone').value = s.phone;
      document.getElementById('address').value = s.address || '';
      document.getElementById('status').value = s.status;
      openModal('supplierModal');
    }
  }

  function deleteSupplier(id){
    if(confirm('Delete this supplier?')){
      suppliers = suppliers.filter(s => s.id !== id);
      localStorage.setItem('retailer_suppliers', JSON.stringify(suppliers));
      renderTable();
      showToast('Supplier deleted!');
    }
  }

  document.getElementById('supplierModal').addEventListener('click', function(e){
    if(e.target.id === 'supplierModal'){
      document.getElementById('supplierModal').querySelector('form').reset();
      editId = null;
      document.getElementById('modalTitle').textContent = 'Add Supplier';
    }
  });

  document.addEventListener('DOMContentLoaded', () => {
    renderTable();
  });
</script>
</body>
</html>
