<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Orders - Retailer Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="glass.css">
  <script src="auth.js"></script>
</head>
<body data-page="orders" data-title="My Orders">

<div class="app">
  <main class="main">
    <section class="kpis">
      <div class="kpi"><span class="glyph">⌘</span><span class="label">Total Orders</span><span class="value" id="kpiTotal">0</span><span class="delta up">All time</span></div>
      <div class="kpi warn"><span class="glyph">⏱</span><span class="label">Pending / Processing</span><span class="value" id="kpiPending">0</span><span class="delta">Action needed</span></div>
      <div class="kpi success"><span class="glyph">✓</span><span class="label">Delivered</span><span class="value" id="kpiDelivered">0</span><span class="delta up">Completed</span></div>
      <div class="kpi purple"><span class="glyph">₹</span><span class="label">Pipeline Value</span><span class="value" id="kpiValue">₹0</span><span class="delta">Open orders</span></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h3>Orders</h3>
        <div class="filters">
          <button class="btn btn-primary" onclick="openModal('newOrderModal')">+ New Order</button>
        </div>
      </div>
      <div class="card-body">
        <div class="filters filters-bar">
          <div class="search-wrap"><input type="text" placeholder="Search orders..." id="searchInput" class="search" onkeyup="filterTable()"></div>
          <select id="statusFilter" onchange="filterTable()">
            <option value="">All Status</option>
            <option>Pending</option>
            <option>Processing</option>
            <option>Shipped</option>
            <option>Delivered</option>
            <option>Cancelled</option>
          </select>
          <button class="btn btn-ghost" onclick="clearFilters()">Clear Filters</button>
        </div>

        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Source</th>
                <th>Items</th>
                <th>Total</th>
                <th>Status</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="ordersBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="modal" id="newOrderModal">
  <div class="modal-content">
    <button class="close-modal" onclick="closeModal()">×</button>
    <h2>Create New Order</h2>
    <form onsubmit="createOrder(event)">
      <div class="form-grid">
        <div class="form-group full"><label>Customer Name</label><input type="text" name="customer" required></div>
        <div class="form-group"><label>Number of Items</label><input type="number" name="items" value="1" min="1" required></div>
        <div class="form-group"><label>Total Amount (₹)</label><input type="number" name="total" step="0.01" min="0" required></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Create Order</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="shell.js"></script>
<script src="common.js"></script>
<script>
  let orders = JSON.parse(localStorage.getItem('retailer_orders') || '[]');

  function pillClass(status) {
    const s = (status || 'Pending').toLowerCase();
    if (s === 'delivered') return 'ready';
    if (s === 'shipped') return 'shipped';
    if (s === 'processing') return 'processing';
    if (s === 'cancelled') return 'out';
    return 'pending';
  }

  function renderKPIs(){
    const pending = orders.filter(o=>['Pending','Processing','Shipped'].includes(o.status||'Pending')).length;
    const delivered = orders.filter(o=>o.status==='Delivered').length;
    const pipeline = orders.filter(o=>o.status!=='Delivered'&&o.status!=='Cancelled').reduce((s,o)=>s+(parseFloat(o.total)||0),0);
    document.getElementById('kpiTotal').textContent = orders.length;
    document.getElementById('kpiPending').textContent = pending;
    document.getElementById('kpiDelivered').textContent = delivered;
    document.getElementById('kpiValue').textContent = '₹' + pipeline.toLocaleString('en-IN');
  }

  function renderTable(){
    renderKPIs();
    const tbody = document.getElementById('ordersBody');
    if(orders.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="table-empty">No orders found. Create a new order or checkout from cart.</td></tr>';
      return;
    }
    
    tbody.innerHTML = orders.map(order => {
      const itemCount = Array.isArray(order.items) ? order.items.length : order.items;
      const itemDisplay = Array.isArray(order.items) ? `${order.items.length} item${order.items.length !== 1 ? 's' : ''}` : `${order.items} item${order.items !== 1 ? 's' : ''}`;
      const source = order.customer || 'Market Space';
      const total = typeof order.total === 'number' ? order.total : parseFloat(order.total) || 0;
      const status = order.status || 'Pending';
      
      return `
        <tr>
          <td><span class="sku">${order.orderId || 'N/A'}</span></td>
          <td>${source}</td>
          <td>${itemDisplay}</td>
          <td><b>₹${total.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</b></td>
          <td><span class="pill ${pillClass(status)}"><span class="dot"></span>${status}</span></td>
          <td>${order.date || 'N/A'}</td>
          <td>
            <div class="row-actions">
              <button class="btn-sm primary" onclick="updateStatus(${order.id}, '${status}')">Update</button>
              <button class="btn-sm danger" onclick="deleteOrder(${order.id})">Delete</button>
            </div>
          </td>
        </tr>
      `;
    }).join('');
  }

  function filterTable(){
    const term = document.getElementById('searchInput').value.toLowerCase();
    const status = document.getElementById('statusFilter').value;
    const rows = document.querySelectorAll('#ordersBody tr');
    rows.forEach(row => {
      const text = row.textContent.toLowerCase();
      const rowStatus = row.cells[4]?.textContent.trim();
      const match = text.includes(term) && (status === '' || rowStatus === status);
      row.style.display = match ? '' : 'none';
    });
  }

  function clearFilters(){
    document.getElementById('searchInput').value = '';
    document.getElementById('statusFilter').value = '';
    filterTable();
  }

  function createOrder(e){
    e.preventDefault();
    const form = e.target;
    const newOrder = {
      id: Date.now(),
      orderId: '#ORD-' + (1000 + orders.length + 1),
      customer: form.customer.value,
      items: parseInt(form.items.value),
      total: parseFloat(form.total.value),
      status: 'Pending',
      date: new Date().toISOString().split('T')[0]
    };
    orders.push(newOrder);
    localStorage.setItem('retailer_orders', JSON.stringify(orders));
    renderTable();
    showToast('Order created!');
    closeModal();
    form.reset();
  }

  function updateStatus(id, currentStatus){
    const statuses = ['Pending', 'Processing', 'Shipped', 'Delivered'];
    const currentIndex = statuses.indexOf(currentStatus);
    const nextStatus = currentIndex < statuses.length - 1 ? statuses[currentIndex + 1] : currentStatus;
    const order = orders.find(o => o.id === id);
    if(order){
      order.status = nextStatus;
      localStorage.setItem('retailer_orders', JSON.stringify(orders));
      renderTable();
      showToast('Order status updated!');
    }
  }

  function deleteOrder(id){
    if(confirm('Are you sure you want to delete this order?')){
      orders = orders.filter(o => o.id !== id);
      localStorage.setItem('retailer_orders', JSON.stringify(orders));
      renderTable();
      showToast('Order deleted!');
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderTable();
  });
</script>
</body>
</html>
