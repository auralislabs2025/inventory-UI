<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Invoices - Retailer Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="glass.css">
  <script src="auth.js"></script>
</head>
<body data-page="invoices" data-title="Invoices">

<div class="app">
  <main class="main">
    <section class="kpis">
      <div class="kpi"><span class="glyph">🧾</span><span class="label">Total Invoices</span><span class="value" id="kpiTotal">0</span><span class="delta">All invoices</span></div>
      <div class="kpi success"><span class="glyph">✓</span><span class="label">Paid</span><span class="value" id="kpiPaid">0</span><span class="delta up">Settled</span></div>
      <div class="kpi warn"><span class="glyph">⏱</span><span class="label">Pending</span><span class="value" id="kpiPending">0</span><span class="delta">Due soon</span></div>
      <div class="kpi danger"><span class="glyph">!</span><span class="label">Overdue</span><span class="value" id="kpiOverdue">0</span><span class="delta down">Action required</span></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h3>Invoices</h3>
        <div class="filters">
          <button class="btn btn-ghost" onclick="exportInvoices()">Export</button>
        </div>
      </div>
      <div class="card-body">
        <div class="filters filters-bar">
          <select id="statusFilter" onchange="filterInvoices()">
            <option value="">All Status</option>
            <option>Paid</option>
            <option>Pending</option>
            <option>Overdue</option>
          </select>
          <input type="date" id="dateFrom" onchange="filterInvoices()">
          <input type="date" id="dateTo" onchange="filterInvoices()">
          <button class="btn btn-ghost" onclick="clearFilters()">Clear Filters</button>
        </div>

        <div class="table-wrap">
          <table id="invoicesTable">
            <thead>
              <tr>
                <th>Invoice #</th>
                <th>Date</th>
                <th>Order ID</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Due Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="invoicesBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="modal" id="invoiceModal">
  <div class="modal-content">
    <button class="close-modal" onclick="closeModal()">×</button>
    <h2>Invoice Details</h2>
    <div id="invoiceDetails"></div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="downloadInvoice()">Download PDF</button>
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="shell.js"></script>
<script src="common.js"></script>
<script>
  let invoices = getInvoices();
  let selectedInvoiceId = null;

  if(invoices.length === 0) {
    const orders = JSON.parse(localStorage.getItem('retailer_orders') || '[]');
    invoices = orders.map((order, index) => ({
      id: Date.now() + index,
      invoiceNumber: 'INV-' + (1000 + index + 1),
      orderId: order.orderId,
      date: order.date,
      dueDate: new Date(new Date(order.date).getTime() + 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
      amount: order.total,
      tax: order.total * 0.18,
      status: index % 3 === 0 ? 'Paid' : index % 3 === 1 ? 'Pending' : 'Overdue',
      items: order.items || []
    }));
    saveInvoices(invoices);
  }

  function pillClass(status) {
    if (status === 'Paid') return 'ready';
    if (status === 'Pending') return 'pending';
    return 'out';
  }

  function renderKPIs(){
    document.getElementById('kpiTotal').textContent = invoices.length;
    document.getElementById('kpiPaid').textContent = invoices.filter(i=>i.status==='Paid').length;
    document.getElementById('kpiPending').textContent = invoices.filter(i=>i.status==='Pending').length;
    document.getElementById('kpiOverdue').textContent = invoices.filter(i=>i.status==='Overdue').length;
  }

  function renderInvoices() {
    renderKPIs();
    const tbody = document.getElementById('invoicesBody');
    tbody.innerHTML = invoices.map(inv => `
      <tr>
        <td><span class="sku">${inv.invoiceNumber}</span></td>
        <td>${inv.date}</td>
        <td>${inv.orderId}</td>
        <td><b>₹${inv.amount.toLocaleString()}</b></td>
        <td><span class="pill ${pillClass(inv.status)}"><span class="dot"></span>${inv.status}</span></td>
        <td>${inv.dueDate}</td>
        <td>
          <div class="row-actions">
            <button class="btn-sm primary" onclick="viewInvoice(${inv.id})">View</button>
            <button class="btn-sm" onclick="downloadInvoice(${inv.id})">Download</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  function filterInvoices() {
    const term = document.getElementById('globalSearch')?.value.toLowerCase() || '';
    const status = document.getElementById('statusFilter').value;
    const dateFrom = document.getElementById('dateFrom').value;
    const dateTo = document.getElementById('dateTo').value;
    const rows = document.querySelectorAll('#invoicesBody tr');
    
    rows.forEach(row => {
      const text = row.textContent.toLowerCase();
      const rowStatus = row.cells[4]?.textContent.trim();
      const rowDate = row.cells[1]?.textContent.trim();
      const matchText = text.includes(term);
      const matchStatus = status === '' || rowStatus === status;
      const matchDateFrom = !dateFrom || rowDate >= dateFrom;
      const matchDateTo = !dateTo || rowDate <= dateTo;
      row.style.display = (matchText && matchStatus && matchDateFrom && matchDateTo) ? '' : 'none';
    });
  }

  function clearFilters() {
    const gs = document.getElementById('globalSearch');
    if (gs) gs.value = '';
    document.getElementById('statusFilter').value = '';
    document.getElementById('dateFrom').value = '';
    document.getElementById('dateTo').value = '';
    filterInvoices();
  }

  function viewInvoice(id) {
    const invoice = invoices.find(inv => inv.id === id);
    if(!invoice) return;
    
    selectedInvoiceId = id;
    document.getElementById('invoiceDetails').innerHTML = `
      <div class="modal-details">
        <p><strong>Invoice Number:</strong> ${invoice.invoiceNumber}</p>
        <p><strong>Order ID:</strong> ${invoice.orderId}</p>
        <p><strong>Date:</strong> ${invoice.date}</p>
        <p><strong>Due Date:</strong> ${invoice.dueDate}</p>
        <p><strong>Status:</strong> <span class="pill ${pillClass(invoice.status)}"><span class="dot"></span>${invoice.status}</span></p>
      </div>
      <h3 class="modal-details">Items</h3>
      <div class="table-wrap glass-inset">
        <table>
          <thead><tr><th>Item</th><th>Quantity</th><th>Price</th><th>Total</th></tr></thead>
          <tbody>
            ${(invoice.items || []).map(item => `
              <tr>
                <td>${item.name || 'Product'}</td>
                <td>${item.quantity || 1}</td>
                <td>₹${(item.price || 0).toLocaleString()}</td>
                <td>₹${((item.price || 0) * (item.quantity || 1)).toLocaleString()}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      <div class="modal-totals">
        <p><strong>Subtotal:</strong> ₹${(invoice.amount - invoice.tax).toLocaleString()}</p>
        <p><strong>Tax (GST):</strong> ₹${invoice.tax.toLocaleString()}</p>
        <p><strong>Total:</strong> ₹${invoice.amount.toLocaleString()}</p>
      </div>
    `;
    openModal('invoiceModal');
  }

  function downloadInvoice(id) {
    const invoice = invoices.find(inv => inv.id === (id || selectedInvoiceId));
    if(invoice) showToast('Invoice download started!');
  }

  function exportInvoices() {
    showToast('Exporting invoices...');
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderInvoices();
  });
</script>
</body>
</html>
