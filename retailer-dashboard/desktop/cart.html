<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Cart - Retailer Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="glass.css">
  <script src="auth.js"></script>
</head>
<body data-page="cart" data-title="My Cart">

<div class="app">
  <main class="main">
    <section class="kpis">
      <div class="kpi"><span class="glyph">🛒</span><span class="label">Cart Items</span><span class="value" id="kpiItems">0</span><span class="delta">In your cart</span></div>
      <div class="kpi success"><span class="glyph">₹</span><span class="label">Subtotal</span><span class="value" id="kpiSubtotal">₹0</span><span class="delta">Before tax</span></div>
      <div class="kpi warn"><span class="glyph">%</span><span class="label">GST (18%)</span><span class="value" id="kpiTax">₹0</span><span class="delta">Estimated tax</span></div>
      <div class="kpi purple"><span class="glyph">⌘</span><span class="label">Total</span><span class="value" id="kpiTotal">₹0</span><span class="delta up">Checkout amount</span></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h3>Shopping Cart</h3>
        <div class="filters">
          <button class="btn btn-ghost is-hidden" onclick="clearCart(); renderCart();" id="clearCartBtn">Clear Cart</button>
        </div>
      </div>
      <div class="card-body">
        <div id="cartItems"></div>

        <div class="cart-summary is-hidden" id="cartSummary">
          <div class="cart-summary-row"><span>Subtotal</span><span id="cartSubtotal">₹0</span></div>
          <div class="cart-summary-row"><span>Tax (GST)</span><span id="cartTax">₹0</span></div>
          <div class="cart-summary-row total"><span>Total</span><span id="cartTotal">₹0</span></div>
          <button class="btn btn-primary btn-block" onclick="checkout()">Proceed to Checkout</button>
        </div>

        <div id="emptyCart" class="empty-state">
          <div class="empty-icon">🛒</div>
          <h3>Your cart is empty</h3>
          <p>Add items from Market Space to get started</p>
          <button class="btn btn-primary" onclick="window.location.href='marketspace.html'">Browse Market Space</button>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="toast" class="toast"></div>

<script src="shell.js"></script>
<script src="common.js"></script>
<script>
  function renderCart() {
    const cart = getCart();
    const container = document.getElementById('cartItems');
    const summary = document.getElementById('cartSummary');
    const emptyCart = document.getElementById('emptyCart');
    const clearBtn = document.getElementById('clearCartBtn');

    if(cart.length === 0) {
      container.innerHTML = '';
      summary.classList.add('is-hidden');
      emptyCart.classList.remove('is-hidden');
      clearBtn.classList.add('is-hidden');
      document.getElementById('kpiItems').textContent = '0';
      document.getElementById('kpiSubtotal').textContent = '₹0';
      document.getElementById('kpiTax').textContent = '₹0';
      document.getElementById('kpiTotal').textContent = '₹0';
      return;
    }

    emptyCart.classList.add('is-hidden');
    clearBtn.classList.remove('is-hidden');
    summary.classList.remove('is-hidden');

    container.innerHTML = cart.map(item => `
      <div class="cart-item">
        <div class="cart-item-info">
          <div class="cart-item-name">${item.name || 'Product'}</div>
          <div class="cart-item-details">Category: ${item.category || 'N/A'} | ₹${(item.price || 0).toLocaleString()} per unit</div>
        </div>
        <div class="cart-item-quantity">
          <div class="quantity-control">
            <button class="quantity-btn" onclick="updateCartItemQty(${item.id}, ${(item.quantity || 1) - 1})">−</button>
            <input type="number" class="quantity-input" value="${item.quantity || 1}" min="1" onchange="updateCartItemQty(${item.id}, parseInt(this.value))">
            <button class="quantity-btn" onclick="updateCartItemQty(${item.id}, ${(item.quantity || 1) + 1})">+</button>
          </div>
        </div>
        <div class="cart-item-price">₹${((item.price || 0) * (item.quantity || 1)).toLocaleString()}</div>
        <button class="btn-sm danger" onclick="removeFromCart(${item.id}); renderCart();">Remove</button>
      </div>
    `).join('');

    const subtotal = cart.reduce((sum, item) => sum + ((item.price || 0) * (item.quantity || 1)), 0);
    const tax = subtotal * 0.18;
    const total = subtotal + tax;

    document.getElementById('kpiItems').textContent = cart.reduce((s,i)=>s+(i.quantity||1),0);
    document.getElementById('kpiSubtotal').textContent = '₹' + subtotal.toLocaleString();
    document.getElementById('kpiTax').textContent = '₹' + tax.toLocaleString();
    document.getElementById('kpiTotal').textContent = '₹' + total.toLocaleString();

    document.getElementById('cartSubtotal').textContent = '₹' + subtotal.toLocaleString();
    document.getElementById('cartTax').textContent = '₹' + tax.toLocaleString();
    document.getElementById('cartTotal').textContent = '₹' + total.toLocaleString();
  }

  function updateCartItemQty(productId, quantity) {
    updateCartQuantity(productId, quantity);
    renderCart();
  }

  function checkout() {
    const cart = getCart();
    if(cart.length === 0) {
      showToast('Cart is empty!');
      return;
    }
    
    const orders = JSON.parse(localStorage.getItem('retailer_orders') || '[]');
    const newOrder = {
      id: Date.now(),
      orderId: '#ORD-' + (1000 + orders.length + 1),
      items: cart,
      total: cart.reduce((sum, item) => sum + ((item.price || 0) * (item.quantity || 1)), 0),
      status: 'Pending',
      date: new Date().toISOString().split('T')[0]
    };
    orders.push(newOrder);
    localStorage.setItem('retailer_orders', JSON.stringify(orders));
    
    clearCart();
    renderCart();
    showToast('Order placed successfully!');
    setTimeout(() => {
      window.location.href = 'orders.html';
    }, 1500);
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderCart();
  });
</script>
</body>
</html>
