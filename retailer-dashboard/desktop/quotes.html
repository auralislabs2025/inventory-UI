<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Active Quotes - Retailer Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="glass.css">
  <script src="auth.js"></script>
</head>
<body data-page="quotes" data-title="Active Quotes">

<div class="app">
  <main class="main">
    <section class="kpis">
      <div class="kpi"><span class="glyph">💬</span><span class="label">Total Quotes</span><span class="value" id="kpiTotal">0</span><span class="delta">All requests</span></div>
      <div class="kpi warn"><span class="glyph">⏱</span><span class="label">Pending</span><span class="value" id="kpiPending">0</span><span class="delta">Awaiting response</span></div>
      <div class="kpi success"><span class="glyph">✓</span><span class="label">Accepted</span><span class="value" id="kpiAccepted">0</span><span class="delta up">Confirmed</span></div>
      <div class="kpi purple"><span class="glyph">₹</span><span class="label">Quoted Value</span><span class="value" id="kpiValue">₹0</span><span class="delta">Active quotes</span></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h3>Active Quotes</h3>
        <div class="filters">
          <button class="btn btn-ghost" onclick="exportQuotes()">Export</button>
        </div>
      </div>
      <div class="card-body">
        <div class="filters filters-bar">
          <select id="statusFilter" onchange="filterQuotes()">
            <option value="">All Status</option>
            <option>Pending</option>
            <option>Quoted</option>
            <option>Accepted</option>
            <option>Rejected</option>
            <option>Expired</option>
          </select>
          <button class="btn btn-ghost" onclick="clearFilters()">Clear Filters</button>
        </div>

        <div class="table-wrap">
          <table id="quotesTable">
            <thead>
              <tr>
                <th>Quote ID</th>
                <th>Product</th>
                <th>Quantity</th>
                <th>Requested Date</th>
                <th>Quoted Price</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="quotesBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="modal" id="quoteDetailsModal">
  <div class="modal-content">
    <button class="close-modal" onclick="closeModal()">×</button>
    <h2>Quote Details</h2>
    <div id="quoteDetails"></div>
    <div class="modal-actions" id="quoteActions"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="shell.js"></script>
<script src="common.js"></script>
<script>
  let quotes = getQuotes();
  let selectedQuoteId = null;
  let products = JSON.parse(localStorage.getItem('retailer_products') || '[]');

  function pillClass(status) {
    if (status === 'Accepted') return 'ready';
    if (status === 'Rejected') return 'out';
    if (status === 'Quoted') return 'processing';
    return 'pending';
  }

  function renderKPIs(){
    document.getElementById('kpiTotal').textContent = quotes.length;
    document.getElementById('kpiPending').textContent = quotes.filter(q=>q.status==='Pending').length;
    document.getElementById('kpiAccepted').textContent = quotes.filter(q=>q.status==='Accepted').length;
    const val = quotes.filter(q=>q.quotedPrice).reduce((s,q)=>s+q.quotedPrice,0);
    document.getElementById('kpiValue').textContent = '₹' + val.toLocaleString('en-IN');
  }

  function renderQuotes() {
    renderKPIs();
    const tbody = document.getElementById('quotesBody');
    if(quotes.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="table-empty">No quotes found. Raise a quote from Market Space to get started.</td></tr>';
      return;
    }

    tbody.innerHTML = quotes.map(quote => {
      const product = products.find(p => p.id === quote.productId);
      const productName = product ? product.name : 'Product #' + quote.productId;
      const quotedPrice = quote.quotedPrice ? '₹' + quote.quotedPrice.toLocaleString() : '-';
      
      return `
        <tr>
          <td><span class="sku">#QT-${quote.id}</span></td>
          <td>${productName}</td>
          <td>${quote.quantity}</td>
          <td>${new Date(quote.createdAt).toLocaleDateString()}</td>
          <td>${quotedPrice}</td>
          <td><span class="pill ${pillClass(quote.status)}"><span class="dot"></span>${quote.status}</span></td>
          <td>
            <div class="row-actions">
              <button class="btn-sm primary" onclick="viewQuote(${quote.id})">View</button>
              ${quote.status === 'Quoted' ? `<button class="btn-sm success" onclick="acceptQuote(${quote.id})">Accept</button>` : ''}
              ${quote.status === 'Quoted' || quote.status === 'Pending' ? `<button class="btn-sm danger" onclick="rejectQuote(${quote.id})">Reject</button>` : ''}
            </div>
          </td>
        </tr>
      `;
    }).join('');
  }

  function filterQuotes() {
    const term = document.getElementById('globalSearch')?.value.toLowerCase() || '';
    const status = document.getElementById('statusFilter').value;
    const rows = document.querySelectorAll('#quotesBody tr');
    
    rows.forEach(row => {
      const text = row.textContent.toLowerCase();
      const rowStatus = row.cells[5] ? row.cells[5].textContent.trim() : '';
      const match = text.includes(term) && (status === '' || rowStatus === status);
      row.style.display = match ? '' : 'none';
    });
  }

  function clearFilters() {
    const gs = document.getElementById('globalSearch');
    if (gs) gs.value = '';
    document.getElementById('statusFilter').value = '';
    filterQuotes();
  }

  function viewQuote(id) {
    const quote = quotes.find(q => q.id === id);
    if(!quote) return;
    
    selectedQuoteId = id;
    const product = products.find(p => p.id === quote.productId);
    const productName = product ? product.name : 'Product #' + quote.productId;
    
    document.getElementById('quoteDetails').innerHTML = `
      <div class="modal-details">
        <p><strong>Quote ID:</strong> #QT-${quote.id}</p>
        <p><strong>Product:</strong> ${productName}</p>
        <p><strong>Quantity:</strong> ${quote.quantity}</p>
        <p><strong>Requested Date:</strong> ${new Date(quote.createdAt).toLocaleDateString()}</p>
        <p><strong>Status:</strong> <span class="pill ${pillClass(quote.status)}"><span class="dot"></span>${quote.status}</span></p>
        ${quote.quotedPrice ? `<p><strong>Quoted Price:</strong> ₹${quote.quotedPrice.toLocaleString()}</p>` : '<p><strong>Quoted Price:</strong> Pending</p>'}
        ${quote.notes ? `<p><strong>Notes:</strong> ${quote.notes}</p>` : ''}
      </div>
    `;
    
    document.getElementById('quoteActions').innerHTML = quote.status === 'Quoted' ? `
      <button class="btn btn-success" onclick="acceptQuote(${quote.id}); closeModal();">Accept Quote</button>
      <button class="btn btn-danger" onclick="rejectQuote(${quote.id}); closeModal();">Reject Quote</button>
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
    ` : `
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
    `;
    
    openModal('quoteDetailsModal');
  }

  function acceptQuote(id) {
    const quote = quotes.find(q => q.id === id);
    if(!quote || !quote.quotedPrice) {
      showToast('Quote price not available');
      return;
    }
    
    quote.status = 'Accepted';
    saveQuotes(quotes);
    renderQuotes();
    showToast('Quote accepted!');
    
    const product = products.find(p => p.id === quote.productId);
    if(product) {
      addToCart({
        ...product,
        quantity: quote.quantity,
        price: quote.quotedPrice / quote.quantity
      });
    }
  }

  function rejectQuote(id) {
    if(confirm('Are you sure you want to reject this quote?')) {
      const quote = quotes.find(q => q.id === id);
      if(quote) {
        quote.status = 'Rejected';
        saveQuotes(quotes);
        renderQuotes();
        showToast('Quote rejected');
      }
    }
  }

  function exportQuotes() {
    showToast('Exporting quotes...');
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderQuotes();
  });
</script>
</body>
</html>
